<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SACCs | SEVIG 2026</title>
    <link rel="stylesheet" href="style1.css">
    <style>
        .filtro-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .filtro-container label {
            font-weight: bold;
            color: var(--cor-primaria);
        }
        .filtro-container input {
            padding: 7px 12px;
            border: 2px solid var(--cor-primaria);
            border-radius: 5px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            width: 280px;
        }
        .filtro-container input:focus { border-color: var(--cor-secundaria); }
        #contador-saccs { font-size: 0.85rem; color: #888; margin-left: auto; }
        .cat-vermelho { color: red; font-weight: bold; }
        .cat-verde { color: green; font-weight: bold; }
        .cat-azul { color: blue; font-weight: bold; }
        .cat-padrao { color: black; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1>SACCs Utilizados</h1>
    </div>
</header>

<main class="container">

    <div class="navegacao">
        <a href="index.html" class="btn btn-secundario">← Início</a>
    </div>

    <section class="tabela-container">
        <h2>Relação de SACCs</h2>

        <div class="filtro-container">
            <label>Pesquisar:</label>
            <input type="text" id="filtro-texto" placeholder="Contrato, objeto ou número SACC..." oninput="filtrar()">
            <span id="contador-saccs"></span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Contrato</th>
                        <th>Objeto Contrato</th>
                        <th>SACC</th>
                    </tr>
                </thead>
                <tbody id="tabela-saccs">
                    <tr><td colspan="3">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <div class="container">
        &copy; 2026 - Junior Alcantara
    </div>
</footer>

<script>
    const SUPABASE_URL = 'https://uezaqoalbxbyzaimxpsb.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_qDXNQda0NJkk1H60uaYG6A_4oOVF8yz';

    let todosSaccs = [];

    async function get(endpoint) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        return res.json();
    }

    function filtrar() {
        const texto = document.getElementById('filtro-texto').value.toLowerCase();
        const tb = document.getElementById('tabela-saccs');
        const filtrados = todosSaccs.filter(s =>
            `${s.contrato} ${s.objeto} ${s.numero_sacc}`.toLowerCase().includes(texto)
        );
        tb.innerHTML = filtrados.length === 0
            ? '<tr><td colspan="3">Nenhum SACC encontrado.</td></tr>'
            : filtrados.map(s => {
                const cls = `cat-${s.categoria || 'padrao'}`;
                return `<tr>
                    <td>${s.contrato}</td>
                    <td class="${cls}">${s.objeto}</td>
                    <td class="${cls}">${s.numero_sacc}</td>
                </tr>`;
            }).join('');
        document.getElementById('contador-saccs').textContent = `${filtrados.length} de ${todosSaccs.length} registros`;
    }

    async function carregar() {
        try {
            todosSaccs = await get('saccs?order=contrato');
            filtrar();
        } catch (err) {
            document.getElementById('tabela-saccs').innerHTML = '<tr><td colspan="3" style="color:red;">Erro ao carregar dados.</td></tr>';
        }
    }

    carregar();
</script>

</body>
</html>
